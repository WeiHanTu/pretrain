name: CI

# CPU-only by design.  Data coverage, checkpoint metadata, config validation,
# incident schemas and the distributed Gloo tests must all stay runnable without
# a GPU, so a correctness regression is caught before any paid compute is used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Assert no data, checkpoints or credentials committed
        run: uv run python scripts/check_repo_hygiene.py
