# Two-host, two-GPU run (Phase C).  The first configuration that crosses a real
# physical network boundary.
#
# PLANNED: not yet executed.  No multi-node claim may be made from this file --
# only from artifacts captured under artifacts/cloud/ showing distinct hostnames.
#
# expect_distinct_hosts makes the topology claim falsifiable: the run aborts if
# the observed hostnames collapse to a single machine, rather than quietly
# logging a "multi-node" result produced by two ranks on one host.

[run]
name = "two_node_l4"
seed = 1234
formal = true

[data]
root = "data/processed/largest/v1"
context_steps = 12
horizon_steps = 12
num_sensors = 1024
num_features = 1

[model]
d_model = 384
num_layers = 8
num_heads = 6
max_sensors = 4096
dropout = 0.0

[optim]
lr = 6e-4
warmup_steps = 200
total_steps = 4000

[train]
micro_batch_size = 8
grad_accum_steps = 1
max_steps = 2000
max_wall_seconds = 7200
eval_every = 250
log_every = 20
dtype = "bf16"

[checkpoint]
dir = "checkpoints/two_node_l4"
every_steps = 100

[distributed]
backend = "nccl"
expect_distinct_hosts = true
expect_world_size = 2

[cost]
sku = "gcp-g2-standard-4-spot-l4"
rate_usd_per_gpu_hour = 0.0
